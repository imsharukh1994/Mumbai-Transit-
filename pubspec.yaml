name: mumbai_transit_plus
description: A production-ready Mumbai transit companion app.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  flutter_riverpod: ^2.0.0
  go_router: ^9.0.0
  firebase_core: ^2.20.1
  firebase_auth: ^4.5.7
  cloud_firestore: ^4.9.0
  firebase_storage: ^11.6.5
  firebase_messaging: ^14.7.0
  firebase_analytics: ^10.0.0
  firebase_crashlytics: ^3.5.7
  google_maps_flutter: ^2.3.0
  geolocator: ^10.0.0
  dio: ^5.0.0
  cached_network_image: ^3.2.0
  flutter_animate: ^4.0.0
  shared_preferences: ^2.0.0
  permission_handler: ^11.0.0
  intl: ^0.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
